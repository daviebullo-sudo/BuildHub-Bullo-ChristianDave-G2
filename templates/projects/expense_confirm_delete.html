{% extends 'base.html' %}
{% block title %}Delete expense | BuildHub{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Delete expense?</h1>
  <p>Remove <strong>{{ expense.description }}</strong> (PHP {{ expense.amount|floatformat:2 }})?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete expense</button>
    <a class="btn btn-secondary-solid" href="{% url 'projects:budget_detail' expense.project_id %}">Cancel</a>
  </form>
</div>
{% endblock %}

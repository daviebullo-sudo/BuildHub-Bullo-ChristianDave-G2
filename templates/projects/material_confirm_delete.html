{% extends 'base.html' %}
{% block title %}Delete material | BuildHub{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Delete material?</h1>
  <p>Remove <strong>{{ material.name }}</strong> ({{ material.quantity|floatformat:2 }} {{ material.unit }})?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete material</button>
    <a class="btn btn-secondary-solid" href="{% url 'projects:materials_detail' material.project_id %}">Cancel</a>
  </form>
</div>
{% endblock %}

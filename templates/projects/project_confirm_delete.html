{% extends 'base.html' %}
{% block title %}Delete project | BuildHub{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Delete project?</h1>
  <p>You are about to permanently delete <strong>{{ project.title }}</strong>. This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a class="btn btn-secondary" href="{{ project.get_absolute_url }}">Cancel</a>
  </form>
</div>
{% endblock %}
